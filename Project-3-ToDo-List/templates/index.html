<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

<div class="container">

    <h1>📝 My To-Do List</h1>

    <form method="POST">
        {% csrf_token %}

        <input
            type="text"
            name="task"
            placeholder="Enter Task"
            required>

        <button type="submit">
            Add
        </button>

    </form>

    <br>

    {% for task in tasks %}

    <div class="task">

        {% if task.completed %}
            <strike>{{ task.title }}</strike>
        {% else %}
            {{ task.title }}
        {% endif %}

        <a href="/complete/{{ task.id }}/">✅</a>

        <a href="/delete/{{ task.id }}/">❌</a>

    </div>

    {% empty %}

    <p>No Tasks Available.</p>

    {% endfor %}

</div>

</body>
</html>
